backends:
  cf_text:
    api_key: any
    base_url: http://host.docker.internal:8008/v1
    enabled: true
    model: cf-text
    supports_images: false
    type: openai_compat
    cf_orch:
      service: cf-text
      model_candidates:
        - granite-4.2-8b
      ttl_s: 300
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    enabled: false
    model: claude-sonnet-4-6
    supports_images: true
    type: anthropic
  claude_code:
    api_key: any
    base_url: http://localhost:3009/v1
    enabled: false
    model: claude-code-terminal
    supports_images: true
    type: openai_compat
  github_copilot:
    api_key: any
    base_url: http://localhost:3010/v1
    enabled: false
    model: gpt-4o
    supports_images: false
    type: openai_compat
  ollama:
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    # 2026-09-26 -- model swapped from alex-cover-writer:latest to llama3.1:8b
    # (generic, not personally fine-tuned). alex-cover-writer was trained on
    # donated cover letters that were supposed to be sanitized first but
    # weren't; a real donor's name ("Meghan") surfaced in another cloud
    # tenant's generated cover letter (peregrine#219). Do not point this
    # backend at alex-cover-writer (or any other per-person *-cover-writer
    # fine-tune on this Ollama host, e.g. meghan-cover-writer) until the
    # sanitized-corpus retrain work in #219 is done.
    enabled: true
    model: llama3.1:8b
    supports_images: false
    type: openai_compat
    cf_orch:
      service: ollama
      ttl_s: 300
  ollama_research:
    api_key: ollama
    base_url: http://host.docker.internal:11434/v1
    enabled: true
    model: llama3.1:8b
    supports_images: false
    type: openai_compat
    cf_orch:
      service: ollama
      ttl_s: 300
  vision_service:
    base_url: http://host.docker.internal:8002
    enabled: true
    supports_images: true
    type: vision_service
  vllm:
    api_key: ''
    base_url: http://host.docker.internal:8000/v1
    enabled: true
    model: __auto__
    supports_images: false
    type: openai_compat
    cf_orch:
      service: vllm
      model_candidates:
        - Qwen2.5-3B-Instruct
      ttl_s: 300
  vllm_research:
    api_key: ''
    base_url: http://host.docker.internal:8000/v1
    enabled: true
    model: __auto__
    supports_images: false
    type: openai_compat
    cf_orch:
      service: vllm
      model_candidates:
        - Qwen2.5-3B-Instruct
      ttl_s: 300
fallback_order:
- ollama
- cf_text
- vllm
research_fallback_order:
- cf_text
- vllm_research
- ollama_research
vision_fallback_order:
- vision_service
