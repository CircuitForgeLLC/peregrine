# Peregrine CI — lint, type-check, test on PR/push
# Full-stack: FastAPI (Python) + Vue 3 SPA (Node)
# Adapted from Circuit-Forge/cf-agents workflows/ci.yml (cf-agents#4 tracks the
# upstream ci-fullstack.yml variant; update this file when that lands).
#
# It follows the branch flow in docs/developer-guide/branching-and-releases.md:
# feature branch -> develop -> freeze/vX.Y.Z -> main. CI runs once per change, on the
# pull request into main, develop or a freeze branch, and again when develop or main
# themselves change. It does not also run on every push to a work branch: a push to a
# branch with an open pull request used to start two full runs (push and pull_request).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'freeze/**']

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libsqlcipher-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tools
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Test
        run: npm run test
