# Tag-triggered release workflow.
# Generates changelog, publishes Docker images to GHCR, and creates Forgejo release.
#
# Images published on v* tags:
#   ghcr.io/circuitforgellc/peregrine:latest        — FastAPI API (includes cf-orch)
#   ghcr.io/circuitforgellc/peregrine:<tag>
#   ghcr.io/circuitforgellc/peregrine-web:latest    — Vue SPA (base path /)
#   ghcr.io/circuitforgellc/peregrine-web:<tag>
#
# The cloud image (compose.cloud.yml) is never published — it is built and
# deployed directly on Heimdall from Dockerfile.cfcore with sibling repos.
#
# Required secrets:
#   FORGEJO_RELEASE_TOKEN    — Forgejo API token for creating releases
#   GH_GHCR_TOKEN            — GitHub PAT with packages:write for GHCR push
#   FORGEJO_CF_ORCH_TOKEN    — Forgejo token to install private circuitforge-orch
#                              during the API image build (BSL client for paid tier)

name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Changelog ────────────────────────────────────────────────────────────
      # orhun/git-cliff-action isn't mirrored on data.forgejo.org (this runner's
      # action registry), so every tag push failed at this exact step since
      # v0.8.6 (11+ consecutive release-workflow failures, including v1.0.0's own
      # tag) -- confirmed via `curl .../api/v1/repos/orhun/git-cliff-action` -> 404,
      # vs actions/checkout and all docker/* actions used below, which resolve
      # fine. Installing the git-cliff binary directly sidesteps the Action
      # wrapper entirely and only needs outbound access to github.com release
      # assets, which this runner already has (see mirror.yml's GitHub push).
      - name: Generate changelog
        id: cliff
        run: |
          set -euo pipefail
          GIT_CLIFF_VERSION="2.14.2"
          ASSET="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          BASE_URL="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          curl -sSL -o "$ASSET" "${BASE_URL}/${ASSET}"
          curl -sSL -o "${ASSET}.sha512" "${BASE_URL}/${ASSET}.sha512"
          sha512sum -c "${ASSET}.sha512"
          tar xzf "$ASSET"
          "./git-cliff-${GIT_CLIFF_VERSION}/git-cliff" --config .cliff.toml --latest --strip header --output CHANGES.md
          {
            echo 'content<<GIT_CLIFF_EOF'
            cat CHANGES.md
            echo 'GIT_CLIFF_EOF'
          } >> "$GITHUB_OUTPUT"

      # ── Docker setup ─────────────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_GHCR_TOKEN }}

      # ── API image ─────────────────────────────────────────────────────────────
      # cf-orch (BSL, private) is installed via BuildKit secret — token never
      # appears in any image layer. Community builds without the secret fall back
      # to local backends automatically.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          secrets: |
            forgejo_token=${{ secrets.FORGEJO_CF_ORCH_TOKEN }}
          tags: |
            ghcr.io/circuitforgellc/peregrine:${{ github.ref_name }}
            ghcr.io/circuitforgellc/peregrine:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Web image ─────────────────────────────────────────────────────────────
      # Published with VITE_BASE_PATH=/ (self-hosted default).
      # Cloud and demo deployments build locally with VITE_BASE_PATH=/peregrine/.
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: docker/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_BASE_PATH=/
          tags: |
            ghcr.io/circuitforgellc/peregrine-web:${{ github.ref_name }}
            ghcr.io/circuitforgellc/peregrine-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ── Forgejo Release ───────────────────────────────────────────────────────
      - name: Create Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          curl -sS -X POST \
            "https://git.circuitforge.tech/api/v1/repos/Circuit-Forge/${REPO}/releases" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "$TAG" --arg body "$NOTES" \
                  '{tag_name: $tag, name: $tag, body: $body}')"
