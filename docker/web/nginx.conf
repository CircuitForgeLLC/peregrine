server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI backend service
    location /api/ {
        proxy_pass http://api:8601;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle /peregrine/ base path — used when accessed directly (no Caddy prefix stripping).
    # ^~ blocks regex location matches so assets at /peregrine/assets/... are served correctly.
    location ^~ /peregrine/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /peregrine/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — must come after API and assets
    location / {
        try_files $uri $uri/ /index.html;
        # index.html has no content hash (unlike /assets/*.js|css above, which
        # are safe to cache forever since Vite renames them on every change),
        # so it must always be revalidated. Without this, browsers can serve a
        # stale index.html after a deploy whose old asset references 404
        # (chunk hashes only exist for one build) — "no-cache" still allows
        # caching, it just forces a conditional GET (If-None-Match) on every
        # request rather than trusting a cached copy blindly.
        add_header Cache-Control "no-cache";
    }
}
